name: iOS simulator build

on:
  workflow_dispatch:
  push:
    paths:
      - "client-ios/**"
      - "daemon/**"
      - ".github/workflows/ios-simulator.yml"
      - ".gitmodules"

permissions:
  contents: read

jobs:
  build:
    name: Build iOS simulator
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install documented build dependencies
        run: |
          brew install carthage node autoconf automake libtool pkg-config yasm
          automake_bin="$(brew --prefix automake)/bin"
          if ! command -v aclocal >/dev/null; then
            ln -s "$automake_bin/$(basename "$(find "$automake_bin" -name 'aclocal-*' -print -quit)")" \
              "$(brew --prefix)/bin/aclocal"
          fi

      - name: Resolve native build cache key
        id: native-key
        run: |
          echo "daemon=$(git -C client-ios/daemon rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "xcode=$(xcodebuild -version | head -1 | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Restore Jami core cache
        id: core-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            client-ios/DEPS
            client-ios/xcframework
          key: ios-core-${{ runner.os }}-${{ steps.native-key.outputs.xcode }}-x86_64-${{ steps.native-key.outputs.daemon }}-${{ hashFiles('client-ios/compile-ios.sh') }}

      - name: Build Jami core for the simulator
        if: steps.core-cache.outputs.cache-hit != 'true'
        working-directory: client-ios
        run: ./compile-ios.sh --platform=iPhoneSimulator --arch=x86_64

      - name: Save Jami core cache
        if: steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            client-ios/DEPS
            client-ios/xcframework
          key: ${{ steps.core-cache.outputs.cache-primary-key }}

      - name: Restore iOS dependency cache
        id: app-dependency-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            client-ios/Ring/Carthage
            ~/Library/Caches/org.carthage.CarthageKit
          key: ios-carthage-${{ runner.os }}-${{ steps.native-key.outputs.xcode }}-${{ hashFiles('client-ios/Ring/Cartfile.resolved') }}

      - name: Fetch iOS app dependencies
        if: steps.app-dependency-cache.outputs.cache-hit != 'true'
        working-directory: client-ios/Ring
        run: ./fetch-dependencies.sh

      - name: Save iOS dependency cache
        if: steps.app-dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            client-ios/Ring/Carthage
            ~/Library/Caches/org.carthage.CarthageKit
          key: ${{ steps.app-dependency-cache.outputs.cache-primary-key }}

      - name: Build the iOS client without signing
        working-directory: client-ios/Ring
        run: >-
          xcodebuild
          -project Ring.xcodeproj
          -scheme Ring
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          ARCHS=x86_64
          ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO
          build
