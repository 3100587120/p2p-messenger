name: iOS simulator build

on:
  workflow_dispatch:
  push:
    paths:
      - "client-ios/**"
      - "daemon/**"
      - ".github/workflows/ios-simulator.yml"
      - ".gitmodules"

permissions:
  contents: read

jobs:
  build:
    name: Build iOS simulator
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Jami core for the simulator
        working-directory: client-ios
        run: ./compile-ios.sh --platform=iPhoneSimulator

      - name: Build the iOS client without signing
        working-directory: client-ios/Ring
        run: >-
          xcodebuild
          -project Ring.xcodeproj
          -scheme Ring
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
