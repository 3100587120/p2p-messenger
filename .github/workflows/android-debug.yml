name: Android debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - "client-android/**"
      - "daemon/**"
      - ".github/workflows/android-debug.yml"
      - ".gitmodules"

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autopoint build-essential cmake libtool m4 \
            ninja-build pkg-config swig yasm
          yes | sdkmanager --licenses
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "cmake;4.1.2" \
            "ndk;29.0.14206865"

      - name: Build debug APK
        working-directory: client-android/jami-android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: p2p-messenger-android-debug-apk
          path: client-android/jami-android/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
